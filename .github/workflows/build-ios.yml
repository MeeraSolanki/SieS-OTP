name: Build iOS Application (.ipa)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
  push:
    branches:
      - master
      - main
    paths:
      - 'OTPGenerator/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI iOS Workload
        run: |
          dotnet workload install maui-ios --source https://api.nuget.org/v3/index.json

      - name: Restore NuGet Packages
        run: |
          if [ -d "OTPGenerator/OTPGenerator.Mobile" ]; then
            cd OTPGenerator
          fi
          dotnet restore OTPGenerator.Mobile/OTPGenerator.Mobile.csproj -p:BuildIosOnly=true

      - name: Build and Package iOS Application
        run: |
          if [ -d "OTPGenerator/OTPGenerator.Mobile" ]; then
            cd OTPGenerator
          fi

          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          echo "Building configuration: $CONFIG"
          
          # Check if Apple Signing Secrets are provided
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "Apple Developer signing credentials detected. Setting up keychain..."
            
            CERT_PATH=$RUNNER_TEMP/build_cert.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD=$(openssl rand -base64 12)

            echo -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode -o $CERT_PATH
            echo -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERT_PATH -P "${{ secrets.P12_PASSWORD }}" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

            dotnet publish OTPGenerator.Mobile/OTPGenerator.Mobile.csproj \
              -f net10.0-ios \
              -c "$CONFIG" \
              -r ios-arm64 \
              -p:BuildIosOnly=true \
              -p:PlatformTarget=ARM64 \
              -p:BuildIpa=true \
              -p:ArchiveOnBuild=true
          else
            echo "No Apple Developer signing certificate provided. Building package for ad-hoc / sideloading..."
            dotnet publish OTPGenerator.Mobile/OTPGenerator.Mobile.csproj \
              -f net10.0-ios \
              -c "$CONFIG" \
              -r ios-arm64 \
              -p:BuildIosOnly=true \
              -p:PlatformTarget=ARM64 \
              -p:EnableCodeSigning=false
          fi

      - name: Locate or Assemble .IPA Package
        run: |
          if [ -d "OTPGenerator/OTPGenerator.Mobile" ]; then
            cd OTPGenerator
          fi

          CONFIG="${{ github.event.inputs.configuration || 'Release' }}"
          mkdir -p output
          
          # Search for an existing .ipa generated by msbuild
          FOUND_IPA=$(find OTPGenerator.Mobile/bin/"$CONFIG"/net10.0-ios -name "*.ipa" | head -n 1)
          
          if [ -n "$FOUND_IPA" ] && [ -f "$FOUND_IPA" ]; then
            echo "Found existing IPA at $FOUND_IPA"
            cp "$FOUND_IPA" output/OTPGenerator.Mobile.ipa
          else
            echo "Packaging .app bundle into standard IPA archive..."
            APP_DIR=$(find OTPGenerator.Mobile/bin/"$CONFIG"/net10.0-ios -name "*.app" -type d | head -n 1)
            
            if [ -z "$APP_DIR" ]; then
              echo "Error: Could not find .app directory."
              exit 1
            fi
            
            echo "Found app bundle at $APP_DIR"
            mkdir -p packaging/Payload
            cp -R "$APP_DIR" packaging/Payload/
            cd packaging
            zip -qr ../output/OTPGenerator.Mobile.ipa Payload
            cd ..
            rm -rf packaging
          fi
          
          echo "IPA successfully prepared:"
          ls -lh output/OTPGenerator.Mobile.ipa

      - name: Upload iOS Package (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: SieS-OTP-iOS-App-IPA
          path: |
            **/output/OTPGenerator.Mobile.ipa
          if-no-files-found: error
          retention-days: 14
